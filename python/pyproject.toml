[build-system]
requires = [
    # CPython 3.14 wheels require Cython >=3.1.3; keep the prior floor for <3.14.
    # (3.1.0/3.1.1 are buggy, cython#6841)
    "Cython>=3.0.4,!=3.1.0,!=3.1.1; python_version < '3.14'",
    "Cython>=3.1.3; python_version >= '3.14'",
    "setuptools>=77.0.3", 
    "packaging", 
    "wheel",
]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev-base = [
    "nvmath-python>=1.0.0, <2.0.0",
    "cuda-pathfinder>=1.6.0, <2",
    "numpy<3,!=2.4.2",
    "opt_einsum",
    "pybind11[global]",
]
cu12-dev = [
    {include-group = "dev-base"},
    "cuda-bindings>=12.9.4, <13.0.0",
    "cupy-cuda12x",
]
cu13-dev = [
    {include-group = "dev-base"},
    "cuda-bindings>=13.0.3, <14.0.0",
    "cupy-cuda13x",
]
jax-cu12-dev = [
    {include-group = "cu12-dev"},
    "jax[cuda12-local]>=0.8",
    "cmake",
    "build",
    "nvidia-cudnn-cu12",
    "nvidia-cuda-cupti-cu12",
]
jax-cu13-dev = [
    {include-group = "cu13-dev"},
    "jax[cuda13-local]>=0.8",
    "cmake",
    "build",
    "nvidia-cudnn-cu13",
    "nvidia-cuda-cupti",
]
doc = [
    "breathe",
    "enum-tools",
    "myst-parser",
    "nvidia-sphinx-theme",
    # Pinned <9 because Sphinx 9.0 rewrote sphinx.ext.autodoc and dropped the
    # `logger` export that enum-tools/sphinx-toolbox import, breaking the build.
    # Unpin once enum-tools and sphinx-toolbox ship releases that support Sphinx 9.
    "sphinx<9",
    "sphinx-toolbox",
    "sphinxcontrib-programoutput",
    "sphinx-copybutton",
    "graphviz",
]